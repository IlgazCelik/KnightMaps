<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RSSI Monitor</title>
  <style>
    :root {
      color-scheme: dark;
      --surface-0: #111111;   /* page */
      --surface-1: #1a1a19;   /* chart surface */
      --surface-2: #2d2d2d;   /* controls */
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8a80;
      --grid: #2e2e2c;
      --series-1: #3987e5;    /* the one series: validated on the dark surface */
      --accent: #ffc904;
    }
    html, body { margin: 0; background: var(--surface-0); color: var(--text-primary); }
    body { font: 15px Roboto, Helvetica, Arial, sans-serif; padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
    h1 { font-size: 20px; margin: 4px 0 12px; font-weight: 800; }
    .row { display: flex; gap: 8px; align-items: center; }
    input#bssid {
      flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid #3a3a3a;
      background: var(--surface-2); color: var(--text-primary); font: 16px ui-monospace, Menlo, monospace;
    }
    button {
      font: 600 14px Roboto, Helvetica, Arial, sans-serif; padding: 10px 14px; border-radius: 10px; border: 0;
      background: var(--surface-2); color: var(--text-primary);
    }
    button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-0); }
    #nearby { list-style: none; margin: 8px 0 0; padding: 4px 0; max-height: 45vh; overflow-y: auto;
      background: var(--surface-2); border-radius: 10px; }
    #nearby li { padding: 9px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
    #nearby li:active { background: #3a3a3a; }
    #nearby .b { font-family: ui-monospace, Menlo, monospace; }
    #nearby .s { color: var(--text-secondary); font-size: 13px; grid-column: 1; }
    #nearby .r { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--text-secondary); }
    .stats { display: flex; align-items: baseline; gap: 14px; margin: 14px 0 6px; flex-wrap: wrap; }
    #now { font-size: 40px; font-weight: 800; letter-spacing: -0.5px; }
    #now small { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-left: 4px; }
    .meta { color: var(--text-secondary); font-size: 13px; }
    #chart-wrap { position: relative; background: var(--surface-1); border-radius: 12px; padding: 6px 4px 2px; touch-action: none; }
    #chart { display: block; width: 100%; height: 260px; }
    #tip { position: absolute; pointer-events: none; padding: 6px 9px; border-radius: 8px; background: #000000d0;
      font-size: 13px; white-space: nowrap; transform: translate(-50%, -110%); }
    .controls { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
    .controls .spacer { flex: 1; }
    #status { color: var(--text-muted); font-size: 13px; min-height: 1.2em; }
    #run { width: 100%; padding: 14px; font-size: 17px; margin-top: 8px; }
    #run.on { background: var(--accent); color: #111111; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>RSSI Monitor</h1>
  <div class="row">
    <input id="bssid" placeholder="aa:bb:cc:dd:ee:ff" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="BSSID">
    <button id="pick" type="button">Nearby</button>
  </div>
  <ul id="nearby" hidden></ul>

  <div class="stats">
    <div id="now">— <small>dBm</small></div>
    <div class="meta" id="meta">Pick a BSSID and press Start</div>
  </div>

  <div id="chart-wrap">
    <svg id="chart" role="img" aria-label="RSSI over time"></svg>
    <div id="tip" hidden></div>
  </div>

  <div class="controls">
    <button type="button" data-window="60" aria-pressed="true">1 min</button>
    <button type="button" data-window="300" aria-pressed="false">5 min</button>
    <button type="button" data-window="0" aria-pressed="false">All</button>
    <span class="spacer"></span>
    <button type="button" id="table-toggle" aria-pressed="false">Table</button>
    <button type="button" id="clear">Clear</button>
  </div>
  <div id="status"></div>
  <div id="table" hidden></div>
  <button id="run" type="button">Start</button>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
